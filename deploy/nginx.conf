# Demirkale önyüzü.
#
# VM'de doğrudan 80 portunu uygulamaya bağlamak yerine araya nginx koyuyoruz:
# tek giriş noktası olur, TLS burada biter ve en önemlisi dev sunucusunun HMR
# websocket'i düzgün geçer — proxy Upgrade başlıklarını taşımazsa sayfa açılır
# ama canlı yenileme sessizce ölür.
#
# TLS: bu dosya düz 80'i dinler ve yalnızca YEREL/GELİŞTİRME içindir. Gerçek bir
# VM'de deploy/nginx-tls.conf kullanın; kurulumu deploy/TLS.md içinde adım adım
# yazıyor. Oturum çerezi güvenli bağlantıda `Secure` ile yazılır ve bunu
# X-Forwarded-Proto belirler (server/account-auth.ts) — yani TLS'siz bir VM'de
# giriş çalışır ama çerez korumasızdır; yayına TLS'siz çıkmayın.

upstream demirkale_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Sahne dosyaları ve kayıtlar büyük olabiliyor.
    client_max_body_size 8m;

    # Dev sunucusu ilk isteklerde npm ci'yi bekliyor olabilir; erken 504 basma.
    proxy_connect_timeout 15s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://demirkale_app;
        proxy_http_version 1.1;

        # HMR ve gelecekteki canlı bağlantılar için şart.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HIZ SINIRI KİMLİĞİ. Uygulama istemci IP'sini bir başlıktan okur
        # (server/rate-limit.ts, CLIENT_IP_HEADER; varsayılan X-Real-IP).
        # X-Real-IP yukarıda $remote_addr ile eziliyor, ama CF-Connecting-IP'ye
        # dokunulmuyordu ve kodun sırasında ÖNCE geliyordu: istemci her istekte
        # rastgele bir CF-Connecting-IP göndererek kendine yeni kova açıyor,
        # login/register/admin-login sınırlarının üçünü birden devre dışı
        # bırakıyordu. Boş değer başlığı isteğe hiç eklemez.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";

        # Dev sunucusu akış hâlinde cevap veriyor; tamponlamak ilk boyamayı geciktirir.
        proxy_buffering off;
    }
}
