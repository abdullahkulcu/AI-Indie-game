# Demirkale önyüzü.
#
# VM'de doğrudan 80 portunu uygulamaya bağlamak yerine araya nginx koyuyoruz:
# tek giriş noktası olur, ileride TLS eklemek için yer açılır ve en önemlisi
# dev sunucusunun HMR websocket'i düzgün geçer — proxy Upgrade başlıklarını
# taşımazsa sayfa açılır ama canlı yenileme sessizce ölür.

upstream demirkale_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Sahne dosyaları ve kayıtlar büyük olabiliyor.
    client_max_body_size 8m;

    # Dev sunucusu ilk isteklerde npm ci'yi bekliyor olabilir; erken 504 basma.
    proxy_connect_timeout 15s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://demirkale_app;
        proxy_http_version 1.1;

        # HMR ve gelecekteki canlı bağlantılar için şart.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dev sunucusu akış hâlinde cevap veriyor; tamponlamak ilk boyamayı geciktirir.
        proxy_buffering off;
    }
}
