# Demirkale önyüzü — TLS'li dağıtım.
#
# Kurulum adımları deploy/TLS.md içinde. Özet:
#   sudo certbot certonly --standalone -d <alan-adı>
#   DOMAIN=<alan-adı> docker compose --profile tls up -d
#
# Bu dosya bir şablondur: ${DOMAIN} çalışma anında doldurulur (compose,
# envsubst ile üretir). Sertifikalar host'tan salt-okunur bağlanır.

upstream demirkale_app {
    server app:3000;
    keepalive 32;
}

# Düz HTTP yalnızca yönlendirir. Oturum çerezi burada YAZILMAZ; uygulama
# X-Forwarded-Proto'ya bakarak karar verir (server/account-auth.ts).
server {
    listen 80;
    server_name ${DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Tarayıcı bir daha düz HTTP denemesin.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 8m;
    proxy_connect_timeout 15s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://demirkale_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Çerezin `Secure` bayrağı buna bakar. https olduğu için bayrak yazılır.
        proxy_set_header X-Forwarded-Proto https;

        # Sahtelenebilir istemci-IP başlıkları silinir; hız sınırı kimliği
        # yalnızca $remote_addr'den doğar (bkz. server/rate-limit.ts).
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";

        proxy_buffering off;
    }
}
