services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: demirkale
      POSTGRES_USER: demirkale
      POSTGRES_PASSWORD: demirkale
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U demirkale"], interval: 3s, timeout: 3s, retries: 20}
    volumes: ["postgres_data:/var/lib/postgresql/data", "./migrations:/docker-entrypoint-initdb.d:ro"]
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
volumes: {postgres_data: {}, redis_data: {}}
