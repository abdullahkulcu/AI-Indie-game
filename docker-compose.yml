# Aynı anda birden fazla kopya çalıştırmak için:
#   COMPOSE_PROJECT_NAME=demirkale-b WEB_PORT=8080 PG_PORT=5434 docker compose up -d
# Proje adı konteyner ve HACİM adlarını da ayırır, yani iki kopya aynı
# veritabanını paylaşmaz. Portlar çakışmasın diye WEB_PORT/PG_PORT verilir.
# Demirkale'yi tek komutla ayağa kaldırır: oyun sunucusu + gece vardiyası cron'u.
#
#   cp .env.example .env   (CRON_SECRET'i .dev.vars ile aynı yapın)
#   docker compose up
#
# `app` vinext/miniflare çalıştırır; veritabanı Cloudflare D1'in yerel karşılığı
# olduğu için ayrı bir Postgres gerekmez. `cron` yalnızca saatte bir /api/cron'u
# çağırır; asıl karar sunucuda verilir.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: demirkale
      POSTGRES_USER: demirkale
      POSTGRES_PASSWORD: demirkale
    ports: ["${PG_PORT:-5433}:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U demirkale"], interval: 3s, timeout: 3s, retries: 30}
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  app:
    # glibc tabanlı TAM imaj şart:
    #  - workerd binary'si glibc'ye bağlıdır; Alpine'ın musl'ında ELF yükleyicisi
    #    bulunamadığı için `spawn ... ENOENT` verir.
    #  - workerd TLS için SİSTEM CA deposunu kullanır (node kendi deposunu taşır).
    #    bookworm-slim'de /etc/ssl/certs boştur, bu yüzden sağlayıcıya giden her
    #    istek "internal error" ile düşer. Tam imajda 285 sertifika hazır gelir.
    image: node:22-bookworm
    working_dir: /app
    # Bayrak --hostname; vinext --host'u tanımaz ve konteynerin içinde loopback'e
    # bağlanır, o zaman dışarıdan ERR_CONNECTION_RESET alırsınız.
    # Şema açılışta uygulanır. Bu olmadan yeni bir VM'de tablolar eksik kalıyor
    # ve uygulama "relation ... does not exist" ile 500 dönüyordu. Kapatmak için
    # DB_AUTO_PUSH=0 verin; o zaman şemayı elle uygularsınız (./run.sh db:push).
    command: >
      sh -c "npm ci --no-audit --no-fund &&
      if [ \"$$DB_AUTO_PUSH\" != \"0\" ]; then npx drizzle-kit push --force || echo 'şema uygulanamadı, elle deneyin: ./run.sh db:push'; fi &&
      npm run dev -- --hostname 0.0.0.0"
    # Dışarıya nginx bakar. Uygulama 3000'i yalnızca compose ağına açar; 3000'i
    # hostta da görmek isterseniz aşağıdaki satırı açın (yerel hata ayıklama).
    # ports: ["${APP_PORT:-3000}:3000"]
    expose: ["3000"]
    volumes:
      - .:/app
      # Host ile konteyner farklı platformlar; bağımlılık ve derleme önbelleği ayrılmalı.
      - node_modules:/app/node_modules
      - vinext_cache:/app/.vinext
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://demirkale:demirkale@postgres:5432/demirkale
      # Host'ta çalışan bir dev sunucusunun kilit dosyası bind-mount ile içeri
      # sızıyor ve "Another vinext dev server is already running" hatasına yol açıyor.
      VINEXT_NO_DEV_LOCK: "1"
      DB_AUTO_PUSH: ${DB_AUTO_PUSH:-1}
    healthcheck:
      # node her zaman var; curl/wget imaja göre değişir.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # Gece vardiyasını tetikler. Emri olmayan hesap sunucuda hiç işlenmez;
  # bu servis yalnızca "şimdi kontrol et" demekten ibarettir.
  cron:
    image: alpine:3.20
    depends_on:
      app: {condition: service_healthy}
    # Sır, Worker'ın okuduğu dosyanın aynısından gelir. Ayrı bir .env tutulsaydı
    # iki dosya ayrışabilir ve cron sessizce 401 alırdı.
    env_file: [.dev.vars]
    environment:
      CRON_TARGET: ${CRON_TARGET:-http://app:3000/api/cron}
      CRON_INTERVAL_SECONDS: ${CRON_INTERVAL_SECONDS:-3600}
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null
        echo "gece vardiyası tetikleyicisi hazır: $$CRON_TARGET her $$CRON_INTERVAL_SECONDS saniyede"
        while true; do
          printf '%s ' "$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -sS -X POST "$$CRON_TARGET" \
            -H "x-cron-secret: $$CRON_SECRET" \
            -H 'content-type: application/json' \
            --max-time 120 || echo "tetikleme başarısız"
          echo
          sleep "$$CRON_INTERVAL_SECONDS"
        done

  # VM'de 80 portunu uygulamaya doğrudan bağlamak yerine önüne nginx koyuyoruz:
  # tek giriş noktası, ileride TLS için yer ve HMR websocket'inin düzgün geçmesi.
  nginx:
    image: nginx:1.27-alpine
    ports: ["${WEB_PORT:-80}:80"]
    volumes:
      - ./deploy/upgrade-map.conf:/etc/nginx/conf.d/00-upgrade-map.conf:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app: {condition: service_started}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: {}
  node_modules: {}
  vinext_cache: {}
