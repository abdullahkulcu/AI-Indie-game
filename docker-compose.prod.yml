# Demirkale — ÜRETİM örtüsü.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   (kısayol: ./run.sh prod)
#
# Taban dosya geliştirme yığınıdır: dev sunucusu (HMR, derleme optimizasyonu
# yok) ve şemayı `drizzle-kit push --force` ile uygulayan bir açılış komutu.
# İkisi de canlı bir VM'de yanlıştır. Bu örtü üç şeyi değiştirir:
#
#  1. NODE_ENV=production ve `npm run build` + `npm start` — dev sunucusu değil.
#  2. Şema `drizzle-kit migrate` ile uygulanır: drizzle/pg altındaki üretilmiş
#     göçler sırayla, kaydedilerek işlenir. `push` şemayı diff'leyip YIKICI
#     değişikliği onay sormadan uygular ve hangi adımın uygulandığını hiçbir
#     yere yazmaz; üretimde geri dönüşü olmayan veri kaybı demektir.
#  3. Kaynak ağacı salt-okunur bağlı kalır; derleme kapsayıcı içindeki geçici
#     çalışma alanında yapılır.
#
# TLS için ayrıca -f docker-compose.tls.yml ekleyin (bkz. deploy/TLS.md).
services:
  app:
    working_dir: /runtime
    environment:
      NODE_ENV: production
      # Üretimde otomatik `push` KAPALIDIR; şemayı aşağıdaki `migrate` uygular.
      DB_AUTO_PUSH: "0"
    # `npm ci` NODE_ENV=production altında devDependencies'i atlar; vinext,
    # vite ve drizzle-kit orada olduğu için derleme ve göç yapılamazdı.
    # --include=dev bunu açıkça geri alır.
    #
    # `migrate` başarısız olursa açılış DURUR (|| yok): eksik şemayla ayağa
    # kalkan bir sunucu "relation ... does not exist" ile 500 döner ve hatayı
    # oyuncular bulur.
    command: >
      sh -c "find /runtime -mindepth 1 -maxdepth 1 -exec rm -rf {} + &&
      tar -C /app
      --exclude=node_modules --exclude=dist --exclude=.next --exclude=.vinext
      --exclude=.wrangler --exclude=.git --exclude=.dev.vars
      --exclude=.claude/worktrees -cf - . |
      tar -C /runtime -xf - &&
      npm ci --include=dev --no-audit --no-fund &&
      npx drizzle-kit migrate &&
      npm run build &&
      cp /app/.dev.vars .dev.vars &&
      npx wrangler dev --config dist/server/wrangler.json --ip 0.0.0.0 --port 3000"
    volumes:
      - .:/app:ro
      # Derleme ve bağımlılıklar yalnız kapsayıcıya ait, çalıştırılabilir
      # hacme yazılır; kaynak ağacı salt-okunur kalır.
      - runtime:/runtime
    healthcheck:
      # Derleme ilk açılışta uzun sürer; dev sunucusundan geç hazır olur.
      start_period: 300s
    restart: unless-stopped

  postgres:
    # Geliştirme yığını hosttaki drizzle komutları için 5433'ü yayınlar.
    # Canlıda veritabanı yalnız compose ağı üzerinden app/cron tarafından
    # erişilebilir olmalı; Docker'ın yayınlanan portları UFW kurallarını
    # atlayabildiği için bunu yalnız güvenlik duvarına bırakmıyoruz.
    ports: !reset []
    restart: unless-stopped

  cron:
    restart: unless-stopped

volumes:
  runtime: {}
